<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .box {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      color: #24292f;
    }

    p {
      color: #555;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>✅ GitHub Pages Works!</h1>
    <p>Your index.html is loading correctly.</p>
    <p id="time"></p>
  </div>

  <script>
    document.getElementById("time").textContent =
      "Loaded at: " + new Date().toLocaleString();
  </script>
</body>
</html>
